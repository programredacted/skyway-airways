{# London — the clock tower over the river #}
<circle cx="300" cy="158" r="36" fill="{{ gold }}" opacity="0.45"/>
<g fill="{{ sky }}" opacity="0.35">
  <rect x="248" y="330" width="46" height="110"/>
  <rect x="300" y="356" width="34" height="84"/>
  <path d="M340 440 L340 330 Q362 300 384 330 L384 440 Z"/>
</g>

<g fill="#f7f0e1">
  <rect x="96" y="150" width="6" height="30"/>
  <path d="M84 180 L114 180 L108 214 L90 214 Z"/>
  <rect x="82" y="214" width="34" height="44"/>
  <rect x="78" y="258" width="42" height="16"/>
  <rect x="84" y="274" width="30" height="166"/>
</g>
<circle cx="99" cy="236" r="13" fill="{{ warm }}"/>
<circle cx="99" cy="236" r="10" fill="#f7f0e1"/>
<g stroke="{{ warm }}" stroke-width="2" stroke-linecap="round">
  <line x1="99" y1="236" x2="99" y2="229"/>
  <line x1="99" y1="236" x2="104" y2="238"/>
</g>
<g stroke="{{ warm }}" stroke-width="1.6" opacity="0.6">
  {% for y in [294, 320, 346, 372, 398] %}<line x1="86" y1="{{ y }}" x2="112" y2="{{ y }}"/>{% endfor %}
</g>

{# the long parliament front #}
<g fill="#f7f0e1" opacity="0.9">
  <rect x="120" y="352" width="126" height="88"/>
  {% for x in [128, 148, 168, 188, 208, 228] %}
    <path d="M{{ x }} 352 L{{ x + 6 }} 336 L{{ x + 12 }} 352 Z"/>
  {% endfor %}
</g>
<g fill="{{ sky }}" opacity="0.4">
  {% for x in [128, 150, 172, 194, 216] %}
    <path d="M{{ x }} 440 L{{ x }} 392 Q{{ x + 7 }} 380 {{ x + 14 }} 392 L{{ x + 14 }} 440 Z"/>
  {% endfor %}
</g>

<rect x="0" y="440" width="400" height="160" fill="{{ sky }}" opacity="0.5"/>
<g stroke="#f7f0e1" stroke-width="3" fill="none" opacity="0.4">
  <path d="M-10 470 Q70 460 150 470 T310 470 T420 466"/>
  <path d="M-10 504 Q90 492 190 504 T400 500"/>
</g>
